<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <!-- Fondo degradado moderno -->
        <linearGradient id="bgGrad"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#1e293b" />
        </linearGradient>

        <!-- Degradados del bloque cúbico -->
        <linearGradient id="cubeTop"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#1d4ed8" />
        </linearGradient>

        <linearGradient id="cubeLeft"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%">
            <stop offset="0%" stop-color="#1e40af" />
            <stop offset="100%" stop-color="#172554" />
        </linearGradient>

        <linearGradient id="cubeRight"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%">
            <stop offset="0%" stop-color="#2563eb" />
            <stop offset="100%" stop-color="#1e3a8a" />
        </linearGradient>

        <!-- Degradado acento para el atributo / etiqueta HTML -->
        <linearGradient id="accentGrad"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%">
            <stop offset="0%" stop-color="#22d3ee" />
            <stop offset="100%" stop-color="#06b6d4" />
        </linearGradient>

        <!-- Sombra suave del bloque -->
        <filter id="dropShadow"
                x="-20%"
                y="-20%"
                width="140%"
                height="140%">
            <feDropShadow dx="0"
                          dy="16"
                          stdDeviation="20"
                          flood-color="#000000"
                          flood-opacity="0.45" />
        </filter>
    </defs>

    <!-- Fondo redondeado estilo icono de aplicación -->
    <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

    <!-- Brillo sutil de fondo -->
    <circle cx="256"
            cy="240"
            r="160"
            fill="#2563eb"
            opacity="0.12" />

    <!-- Grupo Bloque Gutenberg Isométrico -->
    <g filter="url(#dropShadow)" transform="translate(0, -10)">
        <!-- Cara superior del bloque -->
        <polygon points="256,110 380,180 256,250 132,180" fill="url(#cubeTop)" />

        <!-- Cara izquierda -->
        <polygon points="132,180 256,250 256,380 132,310" fill="url(#cubeLeft)" />

        <!-- Cara derecha -->
        <polygon points="256,250 380,180 380,310 256,380" fill="url(#cubeRight)" />

        <!-- Separaciones / Bordes limpios del bloque -->
        <line x1="256"
              y1="250"
              x2="256"
              y2="380"
              stroke="#1d4ed8"
              stroke-width="2"
              stroke-linecap="round" />
        <line x1="132"
              y1="180"
              x2="256"
              y2="250"
              stroke="#60a5fa"
              stroke-width="2"
              opacity="0.4" />
        <line x1="380"
              y1="180"
              x2="256"
              y2="250"
              stroke="#60a5fa"
              stroke-width="2"
              opacity="0.2" />

        <!-- Icono de Bloque Gutenberg en la cara superior (proyección isométrica) -->
        <!-- Contorno sutil del signo de suma / bloque '+' -->
        <g transform="matrix(0.866 0.5 -0.866 0.5 256 180)" opacity="0.35">
            <rect x="-24"
                  y="-7"
                  width="48"
                  height="14"
                  rx="4"
                  fill="#ffffff" />
            <rect x="-7"
                  y="-24"
                  width="14"
                  height="48"
                  rx="4"
                  fill="#ffffff" />
        </g>
    </g>

    <!-- Insignia flotante frontal: Atributos HTML </> / Tag -->
    <g transform="translate(256, 350)">
        <!-- Cápsula / Badge de fondo -->
        <rect x="-125"
              y="-36"
              width="250"
              height="72"
              rx="36"
              fill="#0b132b"
              stroke="url(#accentGrad)"
              stroke-width="4"
              filter="url(#dropShadow)" />

        <!-- Símbolo de código < / > estilizado -->
        <!-- Bracket izquierdo < -->
        <path d="M-65,-12 L-85,0 L-65,12"
              fill="none"
              stroke="#22d3ee"
              stroke-width="5"
              stroke-linecap="round"
              stroke-linejoin="round" />

        <!-- Texto / Símbolo 'attr' -->
        <text x="-5"
              y="8"
              font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace"
              font-size="22"
              font-weight="700"
              fill="#ffffff"
              letter-spacing="1.5"
              text-anchor="middle">
      [attr]
        </text>

        <!-- Bracket derecho > -->
        <path d="M55,-12 L75,0 L55,12"
              fill="none"
              stroke="#22d3ee"
              stroke-width="5"
              stroke-linecap="round"
              stroke-linejoin="round" />

        <!-- Pequeño punto verde indicador de accesibilidad/activo -->
        <circle cx="95" cy="-16" r="6" fill="#10b981" />
    </g>
</svg>